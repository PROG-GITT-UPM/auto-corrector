# Grader configuration. Copy it to /etc/grader/grader.toml and adjust it.
# Secrets do NOT go here: they go in environment variables (see secrets.env in the README).

[github]
organization = "PROG-GITT-UPM"
token_env = "GITHUB_TOKEN"        # variable holding the token (permissions in the README)
config_repo = "classroom50"       # Classroom 50 configuration repository

[sandbox]
type = "docker"                   # "docker" on the server; "local" only for development
image = "grader-sandbox:3.12"     # docker build -t grader-sandbox:3.12 sandbox/
memory = "256m"
cpus = "1"
processes = 128
# With type = "local" you must also set insecure = true: student code would run on the server
# without isolation.

[work]
dir = "/var/lib/grader"           # downloaded templates, temporary submissions and state

[service]
host = "127.0.0.1"                # without an API token only 127.0.0.1 is allowed
port = 8080
api_token_env = "GRADER_API_TOKEN"
workers = 2                       # grading runs at a time (each one in its own container)
save_every = 60                   # seconds between score writes to Classroom 50
watch_every = 120                 # seconds between watch rounds (0 = no watching)
watch = ["grupo-test/lab-2"]   # assignments graded automatically after each push

# One section per Classroom 50 assignment: "classroom/assignment".
[assignments."grupo-test/lab-2"]
template = "PROG-GITT-UPM/prog-lab-2"  # assignment repository: the tests come from here
ref = "main"
publish_release = true            # Release with the result in the student's repository
save_score = true                 # score in scores.json (shown on the Classroom 50 web)
# extra_tests = "hidden/lab-02.json"  # tests the student does not see (relative to this file)
